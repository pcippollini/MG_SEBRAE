<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr}
header{padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0}.sub{font-size:10px;color:var(--muted);margin-top:3px}
.bar{display:grid;grid-template-columns:1fr repeat(2,auto);gap:5px;padding:5px;background:var(--panel2);border-bottom:1px solid var(--line)}
.notice{display:flex;align-items:center;gap:6px;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:10px;font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}.dot.ok{background:#20c86a}.dot.err{background:#ef4444}
button,select,input{font:inherit}.btn{min-height:38px;border:0;border-radius:8px;padding:6px 9px;color:#fff;font-size:10px;font-weight:900}.next{background:#0f766e}.loc{background:#e11d48}
#map{width:100%;height:100%;min-height:0}
.route-pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#7c3aed;color:#fff;border:3px solid #fff;box-shadow:0 3px 10px #0008;font-size:11px;font-weight:900}
.route-pin.agendado{background:#FACC15;color:#111}.route-pin.retorno{background:#38BDF8}.route-pin.t2{background:#FACC15;color:#111}.route-pin.t3{background:#14B8A6;color:#061817}.route-pin.t4{background:#F97316;color:#17100a}
.gps-pin{width:22px;height:22px;border-radius:50%;background:#ff1744;border:4px solid #fff;box-shadow:0 0 0 6px rgba(255,23,68,.3)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#101a2d;color:#fff}.leaflet-popup-content{min-width:235px}
.popup-title{font-size:15px;font-weight:900;margin-bottom:6px}.line{margin:4px 0;font-size:11px;line-height:1.3;color:#dbe5f4}.muted{color:#9fb0c8;font-size:10px}
.popup-btn{display:block;width:100%;margin-top:7px;padding:9px;border:0;border-radius:8px;text-align:center;text-decoration:none;color:#fff;font-size:10px;font-weight:900;background:#2563eb}
.panel{position:fixed;z-index:10000;left:8px;right:8px;bottom:8px;display:none;padding:10px;background:rgba(9,18,33,.98);border:1px solid #405578;border-radius:12px;box-shadow:0 8px 28px #0007}.panel.show{display:block}
.panel-title{font-size:13px;font-weight:900;margin-bottom:4px}.panel-meta{font-size:10px;color:var(--muted);margin-bottom:8px}
.panel select,.panel input{width:100%;min-height:40px;padding:8px;border:1px solid #3a4c6d;border-radius:8px;background:#17253d;color:#fff;margin-bottom:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.save{background:#16a34a}.close{background:#334155}.danger{background:#991b1b}
.progress{position:absolute;z-index:900;top:8px;right:8px;background:rgba(9,18,33,.92);border:1px solid #405578;border-radius:9px;padding:7px 9px;font-size:10px;font-weight:800;pointer-events:none}
@media(max-width:430px){.bar{grid-template-columns:1fr auto auto}.btn{padding:5px 7px;font-size:9px}header{padding:6px 8px}}
</style>
</head>
<body>
<div class="app">
<header><h1>ROTA 1 • Ariane</h1><div class="sub">5 pontos atribuídos • mesma base Firebase do AGENTEMG</div></header>
<div class="bar"><div class="notice"><span id="dot" class="dot"></span><span id="msg">Conectando...</span></div><button id="next" class="btn next">PRÓXIMO</button><button id="locate" class="btn loc">GPS</button></div>
<div id="map"></div>
</div>
<div id="progress" class="progress">Restantes: —</div>

<form id="panel" class="panel">
<div id="panelTitle" class="panel-title">Ponto</div>
<div id="panelMeta" class="panel-meta"></div>
<select id="status"><option value="">Selecione o status</option></select>
<div id="schedule" style="display:none"><div class="grid2"><input id="date" type="date"><input id="time" type="time" step="60"></div></div>
<div class="grid2"><button id="save" class="btn save" type="submit">SALVAR</button><button id="close" class="btn close" type="button">FECHAR</button></div>
</form>

3:14Z","graph_date":"2026-08-27T11:22:24Z","osm_date":"2026-08-17T00:00:02Z"},"system_message":"Preference 'fastest' has been deprecated, using 'recommend'."}}};
const ASSIGNED_AGENT={id:"ag_77990e61d548",name:"Ariane"};
const firebaseConfig={
 apiKey:"AIzaSyCYfLl08iRHnvnbBcKTaJOsONjFHKd2mrA",
 authDomain:"pilotomg-efe79.firebaseapp.com",
 databaseURL:"https://pilotomg-efe79-default-rtdb.firebaseio.com",
 projectId:"pilotomg-efe79",
 storageBucket:"pilotomg-efe79.firebasestorage.app",
 messagingSenderId:"577008586078",
 appId:"1:577008586078:web:eb8bdd9891418e0777d3cf"
};
const db=getDatabase(initializeApp(firebaseConfig));

const DISPLAY=["CARTEIRA","RETORNAR","RETORNAR_COMERCIAL","RETORNAR_RESIDENCIAL","AGENDADO","APLICAR_T2","APLICAR_T3","APLICAR_T4"];
const DISPLAY_SET=new Set(DISPLAY);
const BASE_SAVE=["INICIADO","RETORNAR_COMERCIAL","RETORNAR_RESIDENCIAL","END_ERRADO","RECUSA","AGENDADO"];
const CONDITIONAL={APLICAR_T2:"T2_APLICADO",APLICAR_T3:"T3_APLICADO",APLICAR_T4:"T4_APLICADO"};
const APPLIED_SOURCE={T2_APLICADO:"APLICAR_T2",T3_APLICADO:"APLICAR_T3",T4_APLICADO:"APLICAR_T4"};
const FINAL=new Set(["INICIADO","END_ERRADO","RECUSA","T2_APLICADO","T3_APLICADO","T4_APLICADO"]);
const LABELS={CARTEIRA:"CARTEIRA",RETORNAR:"RETORNAR",RETORNAR_COMERCIAL:"RETORNAR COMERCIAL",RETORNAR_RESIDENCIAL:"RETORNAR RESIDENCIAL",AGENDADO:"AGENDADO",APLICAR_T2:"APLICAR T2",APLICAR_T3:"APLICAR T3",APLICAR_T4:"APLICAR T4",T2_APLICADO:"T2 APLICADO",T3_APLICADO:"T3 APLICADO",T4_APLICADO:"T4 APLICADO",INICIADO:"INICIADO",END_ERRADO:"END_ERRADO",RECUSA:"RECUSA"};

const $=id=>document.getElementById(id);
const map=L.map("map",{zoomControl:true}).setView([-19.9,-44],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,attribution:"&copy; OpenStreetMap"}).addTo(map);
map.createPane("routePane");map.getPane("routePane").style.zIndex=410;
map.createPane("pointsPane");map.getPane("pointsPane").style.zIndex=650;
map.createPane("agentsPane");map.getPane("agentsPane").style.zIndex=700;

const pointStatus=new Map(),features=new Map(),markers=new Map();
let current=null,ownMarker=null,ownAccuracy=null,agentRef=null,disconnectHandler=null,watchId=null,timerId=null,lastSent=0,lastPos=null,selected="",radiusRelease=100,gpsSeconds=60,gpsDistance=100;

function normText(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toUpperCase()}
function normStatus(v){const x=normText(v||"CARTEIRA").replace(/\s+/g,"_");if(!x||x==="PENDENTE")return"CARTEIRA";if(x==="RECUSADO")return"RECUSA";if(x==="RETORNAR_RESIDENCIA")return"RETORNAR_RESIDENCIAL";if(x==="AGENDAMENTO")return"AGENDADO";return x}
function cnpjOf(p){return String(p?.NROCNPJ_PAD??p?.CNPJ??"").replace(/\D/g,"")}
function label(s){s=normStatus(s);return LABELS[s]||s.replaceAll("_"," ")}
function currentStatus(cnpj,p){return normStatus(pointStatus.get(cnpj)?.status||p?.STATUS_OPERACIONAL||p?.STATUS||"CARTEIRA")}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function hav(a,b){if(!a||!b)return Infinity;const R=6371000,r=x=>x*Math.PI/180,dlat=r(b.lat-a.lat),dlng=r(b.lng-a.lng);const h=Math.sin(dlat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dlng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function dist(v){return v>=1000?`${(v/1000).toFixed(1).replace(".",",")} km`:`${Math.round(v)} m`}
function notice(t,type="wait"){$("msg").textContent=t;$("dot").className="dot"+(type==="ok"?" ok":type==="err"?" err":"")}
function routeUrl(lat,lng){return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`}
function streetUrl(lat,lng){return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`}

function pin(order,status){
 let cls="";
 const s=normStatus(status);
 if(s==="AGENDADO")cls=" agendado";
 else if(s==="RETORNAR"||s.startsWith("RETORNAR_"))cls=" retorno";
 else if(s==="APLICAR_T2")cls=" t2";
 else if(s==="APLICAR_T3")cls=" t3";
 else if(s==="APLICAR_T4")cls=" t4";
 return L.divIcon({className:"",html:`<div class="route-pin${cls}">${order}</div>`,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-17]})
}
function featurePoint(f){const p=f.properties||{},[lng,lat]=f.geometry.coordinates;return{f,p,cnpj:cnpjOf(p),lat:Number(lat),lng:Number(lng),order:Number(p.ORDEM_ROTA||0)}}
function popup(cnpj){
 const f=features.get(cnpj);if(!f)return"Ponto indisponível";
 const x=featurePoint(f),s=currentStatus(cnpj,x.p),st=pointStatus.get(cnpj),d=current?hav(current,{lat:x.lat,lng:x.lng}):Infinity;
 return `<div class="popup-title">${x.order}. ${esc(x.p.NOME_FANTASIA||x.p.RAZAO_SOCIAL||"Empresa")}</div>
 <div class="line"><b>CNPJ:</b> ${esc(cnpj)}</div>
 <div class="line"><b>RAZÃO SOCIAL:</b> ${esc(x.p.RAZAO_SOCIAL||"—")}</div>
 <div class="line"><b>ENDEREÇO:</b> ${esc(x.p.ENDEE||"—")}</div>
 <div class="line"><b>MUNICÍPIO:</b> ${esc(x.p.MUNICIPIO||"—")}</div>
 <div class="line"><b>BANCO:</b> ${esc(x.p.BANCO||"—")}</div>
 <div class="line"><b>AGÊNCIA:</b> ${esc(x.p.AGENCIA_NOME||"—")}</div>
 <div class="line"><b>LINHA AVAL:</b> ${esc(x.p.LINHA_AVAL_NOME||"—")}</div>
 <div class="line"><b>SITUAÇÃO:</b> ${esc(x.p.DESCRICAOSITUACAO||"—")}</div>
 <div class="line"><b>STATUS:</b> ${esc(label(s))}</div>
 ${s==="AGENDADO"?`<div class="line"><b>DATA:</b> ${esc(st?.dataAgendamento||x.p.DATA||"—")} • <b>HORA:</b> ${esc(st?.horaAgendamento||x.p.HORA||"—")}</div>`:""}
 ${st?`<div class="muted">Atualizado por ${esc(st.agente||"—")}</div>`:""}
 <div class="line"><b>Distância:</b> ${Number.isFinite(d)?dist(d):"GPS não ativo"}</div>
 <a class="popup-btn" target="_blank" rel="noopener" href="${routeUrl(x.lat,x.lng)}">ABRIR GOOGLE MAPS</a>
 <a class="popup-btn" target="_blank" rel="noopener" href="${streetUrl(x.lat,x.lng)}" style="background:#334155">STREET VIEW</a>`;
}
function createMarker(cnpj){
 const f=features.get(cnpj);if(!f)return;
 const x=featurePoint(f),s=currentStatus(cnpj,x.p);
 if(!DISPLAY_SET.has(s))return;
 const m=L.marker([x.lat,x.lng],{icon:pin(x.order,s),pane:"pointsPane"}).addTo(map);
 m.bindPopup(popup(cnpj),{maxWidth:330});
 m.on("click",()=>{m.setPopupContent(popup(cnpj));selected=cnpj;configure(s);$("panelTitle").textContent=`${x.order}. ${x.p.NOME_FANTASIA||x.p.RAZAO_SOCIAL||"Ponto"}`;$("panelMeta").textContent=`${cnpj} • ${label(s)}`;$("panel").classList.add("show")});
 markers.set(cnpj,m);
}
function sync(cnpj){
 const f=features.get(cnpj);if(!f)return;
 const x=featurePoint(f),s=currentStatus(cnpj,x.p),m=markers.get(cnpj);
 if(!DISPLAY_SET.has(s)){if(m){map.removeLayer(m);markers.delete(cnpj)}updateProgress();return}
 if(!m){createMarker(cnpj)}else{m.setIcon(pin(x.order,s));m.setPopupContent(popup(cnpj))}
 updateProgress();
}
function configure(cur){
 const allowed=[...BASE_SAVE];if(CONDITIONAL[cur])allowed.push(CONDITIONAL[cur]);
 $("status").innerHTML='<option value="">Selecione o status</option>'+allowed.map(s=>`<option value="${s}">${label(s)}</option>`).join("");
 $("status").value="";$("schedule").style.display="none";$("date").value="";$("time").value="";
}
$("status").onchange=()=>{$("schedule").style.display=$("status").value==="AGENDADO"?"block":"none"};
$("close").onclick=()=>{$("panel").classList.remove("show");selected=""};

function updateProgress(){
 let rest=0,total=features.size;
 for(const [cnpj,f] of features){if(DISPLAY_SET.has(currentStatus(cnpj,f.properties||{})))rest++}
 $("progress").textContent=`Restantes: ${rest}/${total}`;
}
function scheduleData(){const d=$("date").value,t=$("time").value;if(!d||!t)return null;return{dataAgendamento:d.split("-").reverse().join("/"),horaAgendamento:t}}
async function saveStatus(cnpj,status){
 if(!current){notice("Ative o GPS antes de salvar.","err");return false}
 if(!BASE_SAVE.includes(status)&&!Object.values(CONDITIONAL).includes(status)){notice("Status inválido.","err");return false}
 const f=features.get(cnpj);if(!f)return false;
 const x=featurePoint(f),cur=currentStatus(cnpj,x.p),required=APPLIED_SOURCE[status];
 if(required&&cur!==required){notice(`${label(status)} só pode ser usado em ${label(required)}.`,"err");return false}
 const d=hav(current,{lat:x.lat,lng:x.lng});if(d>radiusRelease){notice(`Você está a ${dist(d)} • limite ${Math.round(radiusRelease)} m.`,"err");return false}
 let extra={};
 if(status==="AGENDADO"){const s=scheduleData();if(!s){notice("Informe data e hora.","err");return false}extra=s}
 if(status==="END_ERRADO"&&!confirm("Confirmar END_ERRADO? Você conferiu se o endereço do mapa é o mesmo da empresa?"))return false;
 const base=firebaseConfig.databaseURL.replace(/\/$/,""),url=`${base}/STATUS_PONTOS/${encodeURIComponent(cnpj)}.json`;
 const payload={status,agente:ASSIGNED_AGENT.name,agenteId:ASSIGNED_AGENT.id,hora:{".sv":"timestamp"},...extra};
 const res=await fetch(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),cache:"no-store"});
 if(!res.ok)throw Error(`HTTP_${res.status}`);
 pointStatus.set(cnpj,{...payload,hora:Date.now()});
 sync(cnpj);$("panel").classList.remove("show");selected="";
 notice(FINAL.has(status)?"PONTO SALVO E REMOVIDO":"STATUS SALVO • PONTO MANTIDO","ok");return true;
}
$("panel").onsubmit=async e=>{e.preventDefault();const s=$("status").value;if(!selected||!s)return;const b=$("save");b.disabled=true;b.textContent="SALVANDO...";try{await saveStatus(selected,s)}catch(err){console.error(err);notice("Falha ao salvar status.","err")}finally{b.disabled=false;b.textContent="SALVAR"}};

function nextPoint(){
 if(!current){notice("Aguardando GPS.","err");return}
 const ar=[];
 for(const [cnpj,f] of features){const x=featurePoint(f),s=currentStatus(cnpj,x.p);if(!DISPLAY_SET.has(s))continue;ar.push({...x,cnpj,d:hav(current,{lat:x.lat,lng:x.lng})})}
 if(!ar.length){notice("ROTA CONCLUÍDA","ok");return}
 ar.sort((a,b)=>a.order-b.order);
 const next=ar[0],m=markers.get(next.cnpj);map.setView([next.lat,next.lng],18);if(m){m.setPopupContent(popup(next.cnpj));m.openPopup()}
 notice(`PRÓXIMO: ${next.order} • ${next.p.NOME_FANTASIA||next.p.RAZAO_SOCIAL||next.cnpj}`,"ok");
}
$("next").onclick=nextPoint;
$("locate").onclick=()=>{if(current)map.setView([current.lat,current.lng],18);else notice("Aguardando GPS.","err")};

async function loadConfig(){try{const s=await get(ref(db,"CONFIG"));const c=s.val()||{};radiusRelease=Number(c.raioLiberacao)||100;gpsSeconds=Number(c.gpsAtualizacaoSegundos)||60;gpsDistance=Number(c.gpsDistanciaMinima)||100}catch{}}
function updateOwn(){if(!current)return;const ll=[current.lat,current.lng];if(!ownMarker){ownMarker=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="gps-pin"></div>',iconSize:[30,30],iconAnchor:[15,15]}),pane:"agentsPane"}).addTo(map);ownAccuracy=L.circle(ll,{radius:current.accuracy||0,color:"#ff1744",weight:2,fillOpacity:.08}).addTo(map)}else{ownMarker.setLatLng(ll);ownAccuracy.setLatLng(ll).setRadius(current.accuracy||0)}}
async function sendPos(force=false){if(!agentRef||!current)return;const now=Date.now(),moved=lastPos?hav(lastPos,current):Infinity;if(!force&&now-lastSent<gpsSeconds*1000&&moved<gpsDistance)return;await update(agentRef,{fase:"V0.4",id:ASSIGNED_AGENT.id,nome:ASSIGNED_AGENT.name,online:true,lat:Number(current.lat.toFixed(7)),lng:Number(current.lng.toFixed(7)),precisao:Math.round(current.accuracy||0),ultimaAtualizacao:serverTimestamp()});lastSent=now;lastPos={...current};notice("CONECTADO","ok")}
async function start(){
 await loadConfig();
 agentRef=ref(db,`AGENTES_ONLINE/${ASSIGNED_AGENT.id}`);
 disconnectHandler=onDisconnect(agentRef);await disconnectHandler.update({online:false,ultimaAtualizacao:serverTimestamp()});
 await set(agentRef,{fase:"V0.4",id:ASSIGNED_AGENT.id,nome:ASSIGNED_AGENT.name,online:true,entrada:serverTimestamp(),ultimaAtualizacao:serverTimestamp(),paginaRota:true,rota:ROUTE.routeNo});
 if(!navigator.geolocation){notice("GPS indisponível.","err");return}
 watchId=navigator.geolocation.watchPosition(async g=>{current={lat:g.coords.latitude,lng:g.coords.longitude,accuracy:g.coords.accuracy};updateOwn();await sendPos(lastPos===null)},e=>notice(e.code===1?"Permissão de GPS negada.":"Erro no GPS.","err"),{enableHighAccuracy:true,maximumAge:10000,timeout:25000});
 timerId=setInterval(()=>sendPos(false).catch(console.error),5000);
}

for(const f of ROUTE.points.features||[]){const c=cnpjOf(f.properties||{});if(c)features.set(c,f)}
if(ROUTE.geometry?.features?.length)L.geoJSON(ROUTE.geometry,{style:{color:"#7c3aed",weight:5,opacity:.72},pane:"routePane"}).addTo(map);
const bounds=[];for(const [cnpj,f] of features){const x=featurePoint(f);bounds.push([x.lat,x.lng])}
if(bounds.length)map.fitBounds(bounds,{padding:[22,22],maxZoom:16});

onValue(ref(db,"STATUS_PONTOS"),snap=>{pointStatus.clear();for(const [k,v] of Object.entries(snap.val()||{})){if(k!=="TEMP"&&k!=="TESTE_MANUAL"&&v)pointStatus.set(k,v)}for(const c of features.keys())sync(c);updateProgress()});
window.addEventListener("beforeunload",()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId)});
start().catch(e=>{console.error(e);notice("Falha ao conectar.","err")});
</script>
</body>
