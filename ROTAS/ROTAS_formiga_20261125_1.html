async function loadConfig(){try{const s=await get(ref(db,"CONFIG")),c=s.val()||{};radiusRelease=Number(c.raioLiberacao)||100;gpsSeconds=Number(c.gpsAtualizacaoSegundos)||60;gpsDistance=Number(c.gpsDistanciaMinima)||100}catch{}}

let connected=false,registered=false,epoch=0,sending=false,pendingForce=false,requesting=false,entered=false,lastFix=0,serverOffset=0;

function receiveFix(g){if(!sessionActive)return;const t=Number(g.timestamp);if(!Number.isFinite(t)||Date.now()-t>30000||t<lastFix)return;const lat=Number(g.coords.latitude),lng=Number(g.coords.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return;lastFix=t;current={lat,lng,accuracy:g.coords.accuracy};updateOwn();updateProgress();void sendPos(lastPos===null)}

async function startGps(){sessionActive=true;$("endSession").style.display="inline-block";await loadConfig();if(!sessionActive)return;agentRef=ref(db,`AGENTES_ONLINE/${me.id}`);

 const meta={fase:"V0.4",id:me.id,nome:me.name,online:true,paginaRota:true,rota:route.routeNo,operacao:OP.name};if(!entered){meta.entrada=serverTimestamp();meta.gpsSessaoConfirmada=false;}

function loadMyRoute(){route=(OP.routes||[]).find(r=>Number(r.routeNo)===Number(me.routeNo));if(!route)throw Error("Rota não encontrada");features.clear();for(const f of OP.points?.features||[]){const p=f.properties||{},rn=Number(p._ROTA??p.ROTA??0);if(rn!==Number(route.routeNo))continue;const c=String(p._OP_ID??p._OP_KEY??features.size);features.set(c,f)}if(route.geometry?.features?.length)routeLayer=L.geoJSON(route.geometry,{style:{color:route.color||me.color||"#7c3aed",weight:5,opacity:.78},pane:"routePane"}).addTo(map);const bounds=[];for(const [c,f] of features){const x=pointData(f);bounds.push([x.lat,x.lng]);createMarker(c)}if(bounds.length)map.fitBounds(bounds,{padding:[22,22],maxZoom:16});$("title").textContent=`${route.name||OP.name} • R${route.routeNo} • ${me.name}`;$("subtitle").textContent=`${features.size} pontos atribuídos`;$("distance").textContent=dist(Number(route.distance||0));$("duration").textContent=fmt(Number(route.duration||0));updateProgress()}
for(const a of OP.agents||[]){const o=document.createElement("option");o.value=String(a.routeNo);o.textContent=`R${a.routeNo} • ${a.routeName||"Rota"} • ${a.name}`;$("agent").appendChild(o)}
let manager=false;const gpsMarkers=new Map();
L.DomEvent.disableClickPropagation($("agentMonitor"));L.DomEvent.disableScrollPropagation($("agentMonitor"));
let managerRaw={},managerConnected=false,managerReadError=false;
function ageText(ms){if(!Number.isFinite(ms))return "—";const sec=Math.max(0,Math.floor(ms/1000));return sec<60?`${sec}s`:sec<3600?`${Math.floor(sec/60)}min ${sec%60}s`:`${Math.floor(sec/3600)}h ${Math.floor(sec%3600/60)}min`}
function timeText(t){return Number.isFinite(Number(t))&&Number(t)>0?new Date(Number(t)).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"}):"—"}
function gpsState(v,now=nowServer()){const has=!!v&&v.lat!=null&&v.lng!=null&&Number.isFinite(Number(v.lat))&&Number.isFinite(Number(v.lng))&&Math.abs(Number(v.lat))<=90&&Math.abs(Number(v.lng))<=180;const captured=Number(v?.gpsCapturadoEm)||0, sent=Number(v?.ultimaAtualizacao)||0, stamp=captured||sent,age=has&&stamp>0?Math.max(0,now-stamp):Infinity;const warn=Math.max(120,gpsSeconds*2)*1000,lost=Math.max(300,gpsSeconds*5)*1000;let label,color;if(!managerConnected||managerReadError){label="SEM CONEXÃO DA GESTÃO";color="#64748b"}else if(v?.online!==true){label="OFFLINE";color="#64748b"}else if(v.gpsSessaoConfirmada===false||!has||!stamp){label="AGUARDANDO GPS";color="#b45309"}else if(age>lost){label="SINAL PERDIDO";color="#b91c1c"}else if(age>warn){label="GPS DESATUALIZADO";color="#b45309"}else if(!captured){label="GPS LEGADO • NÃO CONFIRMADO";color="#b45309"}else{label="GPS ATUALIZADO";color="#15803d"}return{has,age,label,color,captured,sent}}
function agentInfo(a,v,st){return `<b>${esc(a.name)}</b><br><b style="color:${st.color}">${st.label}</b><br>Última coordenada: ${timeText(st.captured||st.sent)}${!st.captured&&st.sent?" (registro legado)":""}<br>Há: ${ageText(st.age)}<br>Última transmissão: ${timeText(st.sent)}<br>Entrada: ${timeText(v?.entrada)}<br>Precisão: ${esc(v?.precisao??"—")} m`}
function monitoredAgents(){const by=new Map();for(const a of OP.agents||[]){if(!by.has(a.id))by.set(a.id,{...a,routeNames:[]});by.get(a.id).routeNames.push(a.routeName||('R'+a.routeNo))}return [...by.values()]}
function renderManager(){if(!manager)return;let fresh=0;const list=$("agentMonitorList");list.replaceChildren();for(const a of monitoredAgents()){const v=managerRaw[a.id],st=gpsState(v);if(st.label==="GPS ATUALIZADO")fresh++;const b=document.createElement("button");b.type="button";b.className="monitor-agent";b.innerHTML=`<strong>${esc(a.name)} • ${esc(a.routeNames.join(" / "))}</strong><span style="color:${st.color}">${st.label}</span><small>Última coordenada: ${timeText(st.captured||st.sent)} • ${ageText(st.age)}</small>`;b.disabled=!st.has;b.onclick=()=>{const m=gpsMarkers.get(a.id);if(m){map.setView(m.getLatLng(),17);m.openPopup()}};list.appendChild(b);let m=gpsMarkers.get(a.id);if(!st.has){if(m){map.removeLayer(m);gpsMarkers.delete(a.id)}continue}const icon=L.divIcon({className:"",html:`<div style="white-space:nowrap;background:${st.color};color:white;padding:6px 9px;border:2px solid white;border-radius:12px;font-weight:bold;width:max-content">${esc(a.name)}${st.label==="GPS ATUALIZADO"?"":" • !"}</div>`,iconSize:[32,28],iconAnchor:[16,14]});if(!m){m=L.marker([Number(v.lat),Number(v.lng)],{pane:"gpsPane",icon}).addTo(map).bindPopup(agentInfo(a,v,st));gpsMarkers.set(a.id,m)}else{m.setLatLng([Number(v.lat),Number(v.lng)]);m.setIcon(icon);m.setPopupContent(agentInfo(a,v,st))}}notice(managerConnected&&!managerReadError?`${fresh}/${monitoredAgents().length} GPS atualizados`:"GESTÃO SEM CONEXÃO • posições antigas")}
function startManagerMonitor(){ $("agentMonitor").hidden=false;void loadConfig().then(renderManager);onValue(ref(db,".info/serverTimeOffset"),s=>{serverOffset=Number(s.val())||0;renderManager()});onValue(ref(db,".info/connected"),s=>{managerConnected=s.val()===true;renderManager()});onValue(ref(db,"AGENTES_ONLINE"),s=>{managerRaw=s.val()||{};managerReadError=false;renderManager()},()=>{managerReadError=true;renderManager()});setInterval(renderManager,5000);document.addEventListener("visibilitychange",renderManager)}

const opt=document.createElement("option");opt.value="__GESTAO__";opt.textContent="GESTÃO";$("agent").appendChild(opt);
$("agent").onchange=()=>{$("managerPass").style.display=$("agent").value==="__GESTAO__"?"block":"none"};
function openManager(){manager=true;$("login").classList.add("hide");$("title").textContent=OP.name+" • GESTÃO";$("subtitle").textContent="Todas as rotas e pontos da operação";$("next").style.display="none";$("maps").style.display="none";$("locate").textContent="CENTRALIZAR";const bounds=[];for(const f of OP.points?.features||[]){const p=f.properties||{},c=String(p._OP_ID??p._OP_KEY??features.size);features.set(c,f);createMarker(c);const x=pointData(f);bounds.push([x.lat,x.lng])}for(const r of OP.routes||[]){if(r.geometry?.features?.length)L.geoJSON(r.geometry,{style:{color:r.color||"#7c3aed",weight:5,opacity:.78},pane:"routePane"}).addTo(map)}if(bounds.length)map.fitBounds(bounds,{padding:[22,22],maxZoom:16});$("locate").onclick=()=>{if(bounds.length)map.fitBounds(bounds,{padding:[22,22],maxZoom:16})};$("remaining").textContent=features.size;$("distance").textContent=dist((OP.routes||[]).reduce((n,r)=>n+Number(r.distance||0),0));$("duration").textContent=fmt((OP.routes||[]).reduce((n,r)=>n+Number(r.duration||0),0));startManagerMonitor()}
$("enter").onclick=async()=>{if($("agent").value==="__GESTAO__"){if($("managerPass").value.trim()!=="PRAXIAN"){alert("Senha incorreta.");return}openManager();return}const a=(OP.agents||[]).find(x=>String(x.routeNo)===String($("agent").value));if(!a){alert("Selecione seu nome.");return}me=a;$("login").classList.add("hide");loadMyRoute();try{await startGps()}catch(e){console.error(e);notice("Falha ao conectar GPS")}};
async function endSession(){
 if(ending||manager||!me)return;
 if(!confirm("Encerrar a sessão e parar o compartilhamento do GPS?"))return;
 ending=true;sessionActive=false;++epoch;registered=false;pendingForce=false;
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;
 if(timerId!==null)clearInterval(timerId);timerId=null;

 if(ownMarker){map.removeLayer(ownMarker);ownMarker=null}if(ownAccuracy){map.removeLayer(ownAccuracy);ownAccuracy=null}current=null;

 const warn=setTimeout(()=>notice("GPS ENCERRADO LOCALMENTE • saída pendente de conexão"),8000);

   if(agentRef){await update(agentRef,{online:false,ultimaDesconexao:serverTimestamp()});if(disconnectHandler)try{await disconnectHandler.cancel()}catch(e){console.warn("Cancelamento onDisconnect",e)}}
   clearTimeout(warn);notice("OFFLINE • sessão encerrada");$("endSession").textContent="VOLTAR AO LOGIN";$("endSession").disabled=false;$("endSession").onclick=()=>location.reload();
 }catch(e){clearTimeout(warn);console.error("Encerrar sessão",e);notice("GPS ENCERRADO • saída não confirmada, tente novamente");ending=false;$("endSession").disabled=false;$("endSession").textContent="TENTAR ENCERRAR"}
}
