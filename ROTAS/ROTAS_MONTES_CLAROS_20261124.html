function render(){layer.clearLayers();lines.clearLayers();const rf=$('route').value,sf=$('filter').value;const subset=valid.filter(f=>{const p=f.properties||{};return (rf==='__ALL__'||String(Number(p._ROTA||p.ROTA||0))===rf)&&(sf==='__ALL__'||status(p)===sf)});for(const r of routes){if(rf!=='__ALL__'&&rf!==String(r.routeNo))continue;if(sf!=='__ALL__'&&!subset.some(f=>Number(f.properties?._ROTA||f.properties?.ROTA||0)===r.routeNo))continue;if(r.geometry?.features?.length)L.geoJSON(r.geometry,{style:{color:r.color||pal[(r.routeNo-1)%pal.length],weight:5,opacity:.8},pane:'lines'}).addTo(lines)}for(const f of subset){const p=f.properties||{},n=Number(p._ROTA||p.ROTA||0),order=p._ORDEM||p.ORDEM_ROTA||'',color=p._COR||pal[(n-1+pal.length)%pal.length],html='<div class="pin '+(n?'':'free')+'" style="background:'+(n?color:'#64748b')+'">'+(n?esc(order):'•')+'</div>';L.marker(nums(f),{pane:'markers',icon:L.divIcon({className:'',html,iconSize:[30,30],iconAnchor:[15,15]})}).bindPopup(popup(f),{maxWidth:340}).addTo(layer)}$('total').textContent='TOTAL: '+valid.length;$('routed').textContent='ROTEIRIZADOS: '+valid.filter(f=>Number(f.properties?._ROTA||f.properties?.ROTA||0)>0).length;$('free').textContent='LIVRES: '+valid.filter(f=>!Number(f.properties?._ROTA||f.properties?.ROTA||0)).length;if(subset.length){const b=L.latLngBounds(subset.map(nums));if(b.isValid())map.fitBounds(b.pad(.06),{maxZoom:16})}}
$('filter').onchange=render;$('route').onchange=render;$('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(g=>{here=[g.coords.latitude,g.coords.longitude];if(hereMarker)hereMarker.setLatLng(here);else hereMarker=L.circleMarker(here,{radius:8,color:'#0b57d0',fillColor:'#38bdf8',fillOpacity:1}).addTo(map);map.setView(here,16)},e=>alert('GPS indisponível: '+e.message),{enableHighAccuracy:true});$('search').onclick=()=>{const q=prompt('Buscar CNPJ, empresa, município ou endereço:');if(!q)return;const f=valid.find(x=>Object.values(x.properties||{}).some(v=>String(v??'').toLowerCase().includes(q.toLowerCase())));if(!f)return alert('Não encontrado');$('filter').value='__ALL__';$('route').value='__ALL__';render();map.setView(nums(f),17)};
$('maps').onclick=()=>{let x=$('route').value;if(x==='__ALL__'||x==='0')return alert('Escolha uma rota para abrir no Google Maps.');const ar=valid.filter(f=>Number(f.properties?._ROTA||f.properties?.ROTA||0)===Number(x)).sort((a,b)=>Number(a.properties?._ORDEM||a.properties?.ORDEM_ROTA||0)-Number(b.properties?._ORDEM||b.properties?.ORDEM_ROTA||0));if(!ar.length)return alert('Rota sem pontos');const chunk=ar.slice(0,9),coords=chunk.map(f=>nums(f).join(','));const q=new URLSearchParams({api:'1',origin:here?here.join(','):coords[0],destination:coords.at(-1),travelmode:'driving'});if(coords.length>2)q.set('waypoints',coords.slice(here?0:1,-1).join('|'));window.open('https://www.google.com/maps/dir/?'+q,'_blank');if(ar.length>9)alert('Google Maps abriu os primeiros 9 pontos. Use o mapa para acessar os demais individualmente.');};render();
</script></body></html>
