$('maps').onclick=()=>{let x=$('route').value;if(x==='__ALL__'||x==='0')return alert('Escolha uma rota para abrir no Google Maps.');const ar=valid.filter(f=>Number(f.properties?._ROTA||f.properties?.ROTA||0)===Number(x)).sort((a,b)=>Number(a.properties?._ORDEM||a.properties?.ORDEM_ROTA||0)-Number(b.properties?._ORDEM||b.properties?.ORDEM_ROTA||0));if(!ar.length)return alert('Rota sem pontos');const chunk=ar.slice(0,9),coords=chunk.map(f=>nums(f).join(','));const q=new URLSearchParams({api:'1',origin:here?here.join(','):coords[0],destination:coords.at(-1),travelmode:'driving'});if(coords.length>2)q.set('waypoints',coords.slice(here?0:1,-1).join('|'));window.open('https://www.google.com/maps/dir/?'+q,'_blank');if(ar.length>9)alert('Google Maps abriu os primeiros 9 pontos. Use o mapa para acessar os demais individualmente.');};render();
</script></body></html>
