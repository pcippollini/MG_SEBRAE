    fetch('TTT.geojson')
      .then(response => {
        if (!response.ok) throw new Error('Não foi possível carregar TTT.geojson');
        return response.json();
      })
      .then(data => {
        const camadaPontos = L.geoJSON(data, {
          pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
            radius: 8,
            color: '#ffffff',
            weight: 2,
            fillColor: '#111111',
            fillOpacity: 1
          })
        }).addTo(map);

        const limites = camadaPontos.getBounds();

        if (limites.isValid()) {
          map.fitBounds(limites, { padding: [70, 70], maxZoom: 17 });

          const centro = limites.getCenter();

          const iconeCorinthians = L.divIcon({
            className: 'corinthians-icon',
            html: `<img src="${logoCorinthians}" alt="Corinthians">`,
            iconSize: [76, 96],
            iconAnchor: [38, 48]
          });

          L.marker(centro, {
            icon: iconeCorinthians,
            interactive: false,
            keyboard: false,
            zIndexOffset: 1000
          }).addTo(map);
        } else {
          map.setView([-19.218, -45.001], 16);
        }
      })
      .catch(error => {
        console.error(error);
        map.setView([-19.218, -45.001], 16);
      });
